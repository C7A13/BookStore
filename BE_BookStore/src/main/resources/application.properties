spring.application.name=BookStore
spring.datasource.url=jdbc:mysql://localhost:3306/db_bookstore?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto= validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}
jwt.signerKey=${API_SIGNER_KEY}
jwt.verify.signerKey=${API_VERIFY_SIGNER_KEY}
jwt.access-token-expiration=${ACCESS_TOKEN_EXPIRATION}
jwt.refresh-token-expiration=${REFRESH_TOKEN_EXPIRATION}
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

brevo.api.key=${BREVO_API_KEY}
brevo.sender.email=${BREVO_SENDER_EMAIL}

outbound.identity.client-id=${GG_CLIENT_ID}
outbound.identity.client-secret=${GG_CLIENT_SECRET}
outbound.identity.redirect-uri=http://localhost:5173/oauth2/callback/google

spring.security.oauth2.client.registration.google.client-id=${GG_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GG_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:5173/oauth2/callback/google

facebook.client-id=${FB_CLIENT_ID}
facebook.client-secret=${FB_CLIENT_SECRET}
facebook.redirect-uri=http://localhost:5173/oauth2/callback/facebook

spring.security.oauth2.client.registration.facebook.client-id=${FB_CLIENT_ID}
spring.security.oauth2.client.registration.facebook.client-secret=${FB_CLIENT_SECRET}
spring.security.oauth2.client.registration.facebook.scope=email,public_profile
spring.security.oauth2.client.registration.facebook.redirect-uri=http://localhost:5173/oauth2/callback/facebook



# ===== VNPay Configuration =====
vnpay.tmn-code=${VNPAY_TMN_CODE}
vnpay.hash-secret=${VNPAY_HASH_SECRET}
vnpay.payment-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=${VNPAY_RETURN_URL}
vnpay.ipn-url=${VNPAY_IPN_URL}
vnpay.version=2.1.0
vnpay.command=pay
vnpay.currency-code=VND
vnpay.locale=vn

# Optimize N+1 queries by batch fetching collections and relations
spring.jpa.properties.hibernate.default_batch_fetch_size=20